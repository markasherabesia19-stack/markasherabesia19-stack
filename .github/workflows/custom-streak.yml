name: Custom Monthly Streak Tracker

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6am UTC
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Calculate custom streak & generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: markasherabesia19-stack
        run: |
          python3 << 'EOF'
          import requests, json, os
          from datetime import datetime, timezone
          from collections import defaultdict

          username = os.environ["GH_USERNAME"]
          token    = os.environ["GH_TOKEN"]
          headers  = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # ── GraphQL: fetch last 12 months of contribution weeks ──────────────
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          res  = requests.post("https://api.github.com/graphql",
                               headers=headers,
                               json={"query": query, "variables": {"login": username}})
          data = res.json()
          weeks = (data["data"]["user"]["contributionsCollection"]
                       ["contributionCalendar"]["weeks"])

          # ── Aggregate commits per month ───────────────────────────────────────
          monthly = defaultdict(int)
          for week in weeks:
            for day in week["contributionDays"]:
              if day["contributionCount"] > 0:
                ym = day["date"][:7]          # "YYYY-MM"
                monthly[ym] += day["contributionCount"]

          # ── TikTok-style streak: month survives if >= 3 commits ───────────────
          now       = datetime.now(timezone.utc)
          streak    = 0
          total_commits = sum(monthly.values())

          # Walk backwards from previous month (current month is still in progress)
          year, month = now.year, now.month
          month -= 1
          if month == 0:
            month = 12
            year -= 1

          while True:
            ym = f"{year}-{month:02d}"
            commits_this_month = monthly.get(ym, 0)
            if commits_this_month >= 3:
              streak += 1
            else:
              break                          # streak broken
            # go one month back
            month -= 1
            if month == 0:
              month = 12
              year -= 1
            if year < now.year - 2:
              break                          # cap at 2 years back

          # ── Check if current month already has >= 3 (bonus display) ──────────
          current_ym     = f"{now.year}-{now.month:02d}"
          current_commits = monthly.get(current_ym, 0)
          this_month_safe = current_commits >= 3

          # ── Generate SVG ──────────────────────────────────────────────────────
          fire_color  = "#FF6B6B" if streak > 0 else "#888888"
          ring_color  = "#00B4FF"
          status_text = "🔥 Streak Safe!" if this_month_safe else f"Need {3 - current_commits} more commit(s) this month"
          status_color = "#00FF88" if this_month_safe else "#FFB347"

          svg = f"""<svg width="400" height="195" viewBox="0 0 400 195"
              xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#161B22"/>
              </linearGradient>
            </defs>
            <!-- background -->
            <rect width="400" height="195" rx="10" fill="url(#bg)"
                  stroke="{ring_color}" stroke-width="1.5"/>
            <!-- title -->
            <text x="200" y="32" font-family="monospace" font-size="13"
                  fill="{ring_color}" text-anchor="middle" font-weight="bold"
                  letter-spacing="2">MONTHLY STREAK</text>
            <!-- fire icon -->
            <text x="200" y="95" font-size="38" text-anchor="middle"
                  fill="{fire_color}">🔥</text>
            <!-- streak count -->
            <text x="200" y="128" font-family="monospace" font-size="40"
                  fill="#FFFFFF" text-anchor="middle" font-weight="bold">{streak}</text>
            <text x="200" y="148" font-family="monospace" font-size="12"
                  fill="#888888" text-anchor="middle">consecutive months</text>
            <!-- divider -->
            <line x1="20" y1="160" x2="380" y2="160" stroke="#30363d" stroke-width="1"/>
            <!-- status -->
            <text x="200" y="180" font-family="monospace" font-size="11"
                  fill="{status_color}" text-anchor="middle">{status_text}</text>
            <!-- current month commits note -->
            <text x="200" y="192" font-family="monospace" font-size="9.5"
                  fill="#555" text-anchor="middle">This month: {current_commits} commit(s) · Rule: ≥3/month keeps streak alive</text>
          </svg>"""

          os.makedirs("assets", exist_ok=True)
          with open("assets/custom-streak.svg", "w") as f:
            f.write(svg)

          # save state for debugging
          state = {
            "streak_months": streak,
            "current_month_commits": current_commits,
            "this_month_safe": this_month_safe,
            "total_commits_tracked": total_commits,
            "updated": now.isoformat()
          }
          with open("assets/streak-state.json", "w") as f:
            json.dump(state, f, indent=2)

          print(f"✅ Streak: {streak} months | This month: {current_commits} commits | Safe: {this_month_safe}")
          EOF

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/custom-streak.svg assets/streak-state.json
          git diff --staged --quiet || git commit -m "chore: update custom streak [skip ci]"
          git push
