name: Generate Stats & Custom Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate Stats & Streak SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: markasherabesia19-stack
        run: |
          python3 << 'PYEOF'
          import requests, json, os
          from datetime import datetime, timezone
          from collections import defaultdict

          username = os.environ["GH_USERNAME"]
          token    = os.environ["GH_TOKEN"]
          headers  = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json"
          }

          # ── Fetch GitHub data via GraphQL ─────────────────────────────────────
          query = """
          query($login: String!) {
            user(login: $login) {
              followers { totalCount }
              repositories(first: 100, ownerAffiliations: OWNER) {
                totalCount
                nodes { stargazerCount }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          res  = requests.post(
            "https://api.github.com/graphql",
            headers=headers,
            json={"query": query, "variables": {"login": username}}
          )
          user = res.json()["data"]["user"]
          weeks         = user["contributionsCollection"]["contributionCalendar"]["weeks"]
          total_stars   = sum(r["stargazerCount"] for r in user["repositories"]["nodes"])
          total_repos   = user["repositories"]["totalCount"]
          total_commits = user["contributionsCollection"]["totalCommitContributions"]
          total_prs     = user["contributionsCollection"]["totalPullRequestContributions"]
          total_issues  = user["contributionsCollection"]["totalIssueContributions"]
          followers     = user["followers"]["totalCount"]

          # ── Monthly commit aggregation ────────────────────────────────────────
          monthly = defaultdict(int)
          for week in weeks:
            for day in week["contributionDays"]:
              if day["contributionCount"] > 0:
                monthly[day["date"][:7]] += day["contributionCount"]

          # ── TikTok-style streak: ≥3 commits/month to keep alive ───────────────
          now   = datetime.now(timezone.utc)
          streak = 0
          year, month = now.year, now.month
          month -= 1
          if month == 0:
            month, year = 12, year - 1

          while True:
            ym = f"{year}-{month:02d}"
            if monthly.get(ym, 0) >= 3:
              streak += 1
            else:
              break
            month -= 1
            if month == 0:
              month, year = 12, year - 1
            if year < now.year - 3:
              break

          current_ym      = f"{now.year}-{now.month:02d}"
          current_commits = monthly.get(current_ym, 0)
          this_month_safe = current_commits >= 3
          need_more       = max(0, 3 - current_commits)

          # ── Generate STATS card ───────────────────────────────────────────────
          stats_svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#161B22"/>
              </linearGradient>
            </defs>
            <rect width="495" height="195" rx="10" fill="url(#bg)" stroke="#00B4FF" stroke-width="1.5"/>
            <text x="25" y="35" font-family="monospace" font-size="15" fill="#00B4FF" font-weight="bold">{username}'s GitHub Stats</text>
            <line x1="25" y1="45" x2="470" y2="45" stroke="#21262d" stroke-width="1"/>
            <text x="25"  y="72"  font-family="monospace" font-size="12" fill="#8b949e">&#11088; Total Stars</text>
            <text x="25"  y="92"  font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_stars}</text>
            <text x="25"  y="118" font-family="monospace" font-size="12" fill="#8b949e">&#128230; Repositories</text>
            <text x="25"  y="138" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_repos}</text>
            <text x="25"  y="164" font-family="monospace" font-size="12" fill="#8b949e">&#128101; Followers</text>
            <text x="25"  y="184" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{followers}</text>
            <text x="270" y="72"  font-family="monospace" font-size="12" fill="#8b949e">&#128187; Total Commits</text>
            <text x="270" y="92"  font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_commits}</text>
            <text x="270" y="118" font-family="monospace" font-size="12" fill="#8b949e">&#128256; Pull Requests</text>
            <text x="270" y="138" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_prs}</text>
            <text x="270" y="164" font-family="monospace" font-size="12" fill="#8b949e">&#128027; Issues Opened</text>
            <text x="270" y="184" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_issues}</text>
          </svg>"""

          # ── Generate STREAK card ──────────────────────────────────────────────
          fire   = "&#128293;" if streak > 0 else "&#128164;"
          scolor = "#00FF88" if this_month_safe else "#FFB347"
          smsg   = "Streak Safe!" if this_month_safe else f"Need {need_more} more commit(s) this month!"

          streak_svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#161B22"/>
              </linearGradient>
            </defs>
            <rect width="495" height="195" rx="10" fill="url(#bg2)" stroke="#00B4FF" stroke-width="1.5"/>
            <text x="247" y="30" font-family="monospace" font-size="13" fill="#00B4FF" text-anchor="middle" font-weight="bold" letter-spacing="2">MONTHLY STREAK</text>
            <text x="247" y="47" font-family="monospace" font-size="10" fill="#555555" text-anchor="middle">Rule: &gt;= 3 commits/month keeps streak alive</text>
            <line x1="25" y1="55" x2="470" y2="55" stroke="#21262d" stroke-width="1"/>
            <text x="247" y="105" font-size="38" text-anchor="middle">{fire}</text>
            <text x="247" y="143" font-family="monospace" font-size="48" fill="#FFFFFF" text-anchor="middle" font-weight="bold">{streak}</text>
            <text x="247" y="160" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">consecutive months</text>
            <line x1="25" y1="168" x2="470" y2="168" stroke="#21262d" stroke-width="1"/>
            <text x="247" y="183" font-family="monospace" font-size="11" fill="{scolor}" text-anchor="middle">{smsg} ({current_commits}/3 this month)</text>
          </svg>"""

          os.makedirs("assets", exist_ok=True)
          with open("assets/stats-card.svg",  "w") as f: f.write(stats_svg)
          with open("assets/streak-card.svg", "w") as f: f.write(streak_svg)
          with open("assets/streak-state.json", "w") as f:
            json.dump({
              "streak_months": streak,
              "current_month_commits": current_commits,
              "this_month_safe": this_month_safe,
              "updated": now.isoformat()
            }, f, indent=2)

          print(f"Done! Streak={streak} | This month={current_commits}/3 | Safe={this_month_safe}")
          PYEOF

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update stats & streak cards [skip ci]"
          git push
