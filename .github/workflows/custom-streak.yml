name: Generate Stats & Streak Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate Stats & Streak SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: markasherabesia19-stack
        run: |
          python3 << 'PYEOF'
          import requests, json, os
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict

          username = os.environ["GH_USERNAME"]
          token    = os.environ["GH_TOKEN"]
          headers  = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json"
          }

          # ── Fetch GitHub data ─────────────────────────────────────────────────
          query = """
          query($login: String!) {
            user(login: $login) {
              followers { totalCount }
              repositories(first: 100, ownerAffiliations: OWNER) {
                totalCount
                nodes { stargazerCount }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          res  = requests.post(
            "https://api.github.com/graphql",
            headers=headers,
            json={"query": query, "variables": {"login": username}}
          )
          user          = res.json()["data"]["user"]
          weeks         = user["contributionsCollection"]["contributionCalendar"]["weeks"]
          total_stars   = sum(r["stargazerCount"] for r in user["repositories"]["nodes"])
          total_repos   = user["repositories"]["totalCount"]
          total_commits = user["contributionsCollection"]["totalCommitContributions"]
          total_prs     = user["contributionsCollection"]["totalPullRequestContributions"]
          total_issues  = user["contributionsCollection"]["totalIssueContributions"]
          followers     = user["followers"]["totalCount"]
          total_contribs = user["contributionsCollection"]["contributionCalendar"]["totalContributions"]

          # ── Daily streak (standard: consecutive days with contributions) ───────
          all_days = {}
          for week in weeks:
            for day in week["contributionDays"]:
              all_days[day["date"]] = day["contributionCount"]

          now = datetime.now(timezone.utc).date()
          streak = 0
          longest = 0
          current = 0
          check = now

          # if today has no commits yet, start checking from yesterday
          if all_days.get(str(now), 0) == 0:
            check = now - timedelta(days=1)

          while True:
            s = str(check)
            if all_days.get(s, 0) > 0:
              streak += 1
              check -= timedelta(days=1)
            else:
              break

          # longest streak
          temp = 0
          for d in sorted(all_days):
            if all_days[d] > 0:
              temp += 1
              longest = max(longest, temp)
            else:
              temp = 0

          # ── STATS card ────────────────────────────────────────────────────────
          stats_svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#161B22"/>
              </linearGradient>
            </defs>
            <rect width="495" height="195" rx="10" fill="url(#bg)" stroke="#00B4FF" stroke-width="1.5"/>
            <text x="25" y="35" font-family="monospace" font-size="15" fill="#00B4FF" font-weight="bold">{username}'s GitHub Stats</text>
            <line x1="25" y1="45" x2="470" y2="45" stroke="#21262d" stroke-width="1"/>
            <text x="25"  y="72"  font-family="monospace" font-size="12" fill="#8b949e">&#11088; Total Stars Earned</text>
            <text x="25"  y="92"  font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_stars}</text>
            <text x="25"  y="118" font-family="monospace" font-size="12" fill="#8b949e">&#128230; Total Repos</text>
            <text x="25"  y="138" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_repos}</text>
            <text x="25"  y="164" font-family="monospace" font-size="12" fill="#8b949e">&#128101; Followers</text>
            <text x="25"  y="184" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{followers}</text>
            <text x="270" y="72"  font-family="monospace" font-size="12" fill="#8b949e">&#128187; Total Commits</text>
            <text x="270" y="92"  font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_commits}</text>
            <text x="270" y="118" font-family="monospace" font-size="12" fill="#8b949e">&#128256; Pull Requests</text>
            <text x="270" y="138" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_prs}</text>
            <text x="270" y="164" font-family="monospace" font-size="12" fill="#8b949e">&#128027; Issues Opened</text>
            <text x="270" y="184" font-family="monospace" font-size="20" fill="#FFFFFF" font-weight="bold">{total_issues}</text>
          </svg>"""

          # ── STREAK card ───────────────────────────────────────────────────────
          streak_svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#161B22"/>
              </linearGradient>
            </defs>
            <rect width="495" height="195" rx="10" fill="url(#bg2)" stroke="#00B4FF" stroke-width="1.5"/>

            <!-- Total contributions (left) -->
            <text x="100" y="60" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Total Contributions</text>
            <text x="100" y="88" font-family="monospace" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">{total_contribs}</text>
            <text x="100" y="106" font-family="monospace" font-size="10" fill="#555">this year</text>

            <!-- Current streak (center) -->
            <text x="247" y="48" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Current Streak</text>
            <text x="247" y="105" font-size="34" text-anchor="middle">&#128293;</text>
            <text x="247" y="143" font-family="monospace" font-size="40" fill="#FFFFFF" text-anchor="middle" font-weight="bold">{streak}</text>
            <text x="247" y="160" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">days</text>

            <!-- Longest streak (right) -->
            <text x="395" y="60" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Longest Streak</text>
            <text x="395" y="88" font-family="monospace" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">{longest}</text>
            <text x="395" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">days</text>

            <!-- dividers -->
            <line x1="175" y1="30" x2="175" y2="175" stroke="#21262d" stroke-width="1"/>
            <line x1="320" y1="30" x2="320" y2="175" stroke="#21262d" stroke-width="1"/>
            <line x1="25"  y1="175" x2="470" y2="175" stroke="#21262d" stroke-width="1"/>
            <text x="247" y="188" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">Updated daily via GitHub Actions</text>
          </svg>"""

          os.makedirs("assets", exist_ok=True)
          with open("assets/stats-card.svg",  "w") as f: f.write(stats_svg)
          with open("assets/streak-card.svg", "w") as f: f.write(streak_svg)

          print(f"Done! Commits={total_commits} | Streak={streak}d | Longest={longest}d")
          PYEOF

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg assets/streak-card.svg
          git diff --staged --quiet || git commit -m "chore: update stats & streak [skip ci]"
          git push
