name: Generate Stats & Streak Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate Stats & Streak SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: markasherabesia19-stack
        run: |
          python3 << 'PYEOF'
          import requests, json, os
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict

          username = os.environ["GH_USERNAME"]
          token    = os.environ["GH_TOKEN"]
          headers  = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json"
          }

          # ── Fetch GitHub data ─────────────────────────────────────────────────
          query = """
          query($login: String!) {
            user(login: $login) {
              createdAt
              followers { totalCount }
              repositories(first: 100, ownerAffiliations: OWNER) {
                totalCount
                nodes { stargazerCount }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          res  = requests.post(
            "https://api.github.com/graphql",
            headers=headers,
            json={"query": query, "variables": {"login": username}}
          )
          user           = res.json()["data"]["user"]
          weeks          = user["contributionsCollection"]["contributionCalendar"]["weeks"]
          total_stars    = sum(r["stargazerCount"] for r in user["repositories"]["nodes"])
          total_repos    = user["repositories"]["totalCount"]
          total_commits  = user["contributionsCollection"]["totalCommitContributions"]
          total_prs      = user["contributionsCollection"]["totalPullRequestContributions"]
          total_issues   = user["contributionsCollection"]["totalIssueContributions"]
          followers      = user["followers"]["totalCount"]
          total_contribs = user["contributionsCollection"]["contributionCalendar"]["totalContributions"]
          joined         = user["createdAt"][:10]

          # ── Build day map ─────────────────────────────────────────────────────
          all_days = {}
          for week in weeks:
            for day in week["contributionDays"]:
              all_days[day["date"]] = day["contributionCount"]

          now = datetime.now(timezone.utc).date()

          # ── Current streak ────────────────────────────────────────────────────
          streak = 0
          check  = now
          if all_days.get(str(now), 0) == 0:
            check = now - timedelta(days=1)
          while all_days.get(str(check), 0) > 0:
            streak += 1
            check  -= timedelta(days=1)

          # streak date range
          if streak > 0:
            streak_end   = now if all_days.get(str(now), 0) > 0 else now - timedelta(days=1)
            streak_start = streak_end - timedelta(days=streak - 1)
            streak_range = f"{streak_start.strftime('%b %d')} - {streak_end.strftime('%b %d')}"
          else:
            streak_range = "No active streak"

          # ── Longest streak ────────────────────────────────────────────────────
          longest = 0
          longest_start = longest_end = None
          temp = 0
          temp_start = None
          for d in sorted(all_days):
            if all_days[d] > 0:
              if temp == 0:
                temp_start = d
              temp += 1
              if temp > longest:
                longest       = temp
                longest_start = temp_start
                longest_end   = d
            else:
              temp = 0

          if longest_start and longest_end:
            ls = datetime.strptime(longest_start, "%Y-%m-%d")
            le = datetime.strptime(longest_end,   "%Y-%m-%d")
            longest_range = f"{ls.strftime('%b %d')} - {le.strftime('%b %d')}"
          else:
            longest_range = ""

          # ── STATS card ────────────────────────────────────────────────────────
          stats_svg = f"""<svg width="470" height="195" viewBox="0 0 470 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#0d1f2d"/>
              </linearGradient>
            </defs>
            <rect width="470" height="195" rx="12" fill="url(#sbg)" stroke="#00B4FF" stroke-width="1.5"/>

            <!-- Title -->
            <text x="235" y="32" font-family="'Courier New',monospace" font-size="13"
                  fill="#00B4FF" text-anchor="middle" font-weight="bold" letter-spacing="1">
              {username}'s GitHub Stats
            </text>
            <line x1="20" y1="42" x2="450" y2="42" stroke="#1c2d3a" stroke-width="1"/>

            <!-- Row 1 -->
            <text x="30"  y="68" font-family="monospace" font-size="11" fill="#8b949e">&#11088; Stars Earned</text>
            <text x="30"  y="87" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{total_stars}</text>

            <text x="175" y="68" font-family="monospace" font-size="11" fill="#8b949e">&#128187; Total Commits</text>
            <text x="175" y="87" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{total_commits}</text>

            <text x="330" y="68" font-family="monospace" font-size="11" fill="#8b949e">&#128101; Followers</text>
            <text x="330" y="87" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{followers}</text>

            <line x1="20" y1="100" x2="450" y2="100" stroke="#1c2d3a" stroke-width="1"/>

            <!-- Row 2 -->
            <text x="30"  y="126" font-family="monospace" font-size="11" fill="#8b949e">&#128230; Repositories</text>
            <text x="30"  y="145" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{total_repos}</text>

            <text x="175" y="126" font-family="monospace" font-size="11" fill="#8b949e">&#128256; Pull Requests</text>
            <text x="175" y="145" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{total_prs}</text>

            <text x="330" y="126" font-family="monospace" font-size="11" fill="#8b949e">&#128027; Issues</text>
            <text x="330" y="145" font-family="monospace" font-size="22" fill="#FFFFFF" font-weight="bold">{total_issues}</text>

            <line x1="20" y1="158" x2="450" y2="158" stroke="#1c2d3a" stroke-width="1"/>
            <text x="235" y="178" font-family="monospace" font-size="10" fill="#555"
                  text-anchor="middle">Updated daily &#183; GitHub Actions</text>
          </svg>"""

          # ── STREAK card ───────────────────────────────────────────────────────
          streak_svg = f"""<svg width="470" height="195" viewBox="0 0 470 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="stbg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0D1117"/>
                <stop offset="100%" style="stop-color:#0d1f2d"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="470" height="195" rx="12" fill="url(#stbg)" stroke="#00B4FF" stroke-width="1.5"/>

            <!-- vertical dividers -->
            <line x1="157" y1="20" x2="157" y2="175" stroke="#1c2d3a" stroke-width="1"/>
            <line x1="314" y1="20" x2="314" y2="175" stroke="#1c2d3a" stroke-width="1"/>
            <line x1="20"  y1="175" x2="450" y2="175" stroke="#1c2d3a" stroke-width="1"/>

            <!-- Total Contributions -->
            <text x="78" y="55" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle" font-weight="bold">Total Contributions</text>
            <text x="78" y="105" font-family="monospace" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold" filter="url(#glow)">{total_contribs}</text>
            <text x="78" y="125" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">{joined} - Present</text>

            <!-- Current Streak (center, biggest) -->
            <text x="235" y="40" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle" font-weight="bold">Current Streak</text>
            <text x="235" y="80" font-size="28" text-anchor="middle">&#128293;</text>
            <text x="235" y="128" font-family="monospace" font-size="42" fill="#FFFFFF" text-anchor="middle" font-weight="bold" filter="url(#glow)">{streak}</text>
            <text x="235" y="148" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">{streak_range}</text>

            <!-- Longest Streak -->
            <text x="392" y="55" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle" font-weight="bold">Longest Streak</text>
            <text x="392" y="105" font-family="monospace" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold" filter="url(#glow)">{longest}</text>
            <text x="392" y="125" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">{longest_range}</text>

            <text x="235" y="189" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">Updated daily &#183; GitHub Actions</text>
          </svg>"""

          os.makedirs("assets", exist_ok=True)
          with open("assets/stats-card.svg",  "w") as f: f.write(stats_svg)
          with open("assets/streak-card.svg", "w") as f: f.write(streak_svg)

          print(f"Done! Stars={total_stars} | Commits={total_commits} | Streak={streak}d | Longest={longest}d")
          PYEOF

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg assets/streak-card.svg
          git diff --staged --quiet || git commit -m "chore: update stats & streak [skip ci]"
          git push
