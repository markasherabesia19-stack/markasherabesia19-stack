<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="10" fill="url(#bg2)" stroke="#00B4FF" stroke-width="1.5"/>

  <!-- Total contributions (left) -->
  <text x="100" y="60" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Total Contributions</text>
  <text x="100" y="88" font-family="monospace" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">523</text>
  <text x="100" y="106" font-family="monospace" font-size="10" fill="#555">this year</text>

  <!-- Current streak (center) -->
  <text x="247" y="48" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Current Streak</text>
  <text x="247" y="105" font-size="34" text-anchor="middle">&#128293;</text>
  <text x="247" y="143" font-family="monospace" font-size="40" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="247" y="160" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">days</text>

  <!-- Longest streak (right) -->
  <text x="395" y="60" font-family="monospace" font-size="11" fill="#00B4FF" text-anchor="middle">Longest Streak</text>
  <text x="395" y="88" font-family="monospace" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">47</text>
  <text x="395" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">days</text>

  <!-- dividers -->
  <line x1="175" y1="30" x2="175" y2="175" stroke="#21262d" stroke-width="1"/>
  <line x1="320" y1="30" x2="320" y2="175" stroke="#21262d" stroke-width="1"/>
  <line x1="25"  y1="175" x2="470" y2="175" stroke="#21262d" stroke-width="1"/>
  <text x="247" y="188" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">Updated daily via GitHub Actions</text>
</svg>