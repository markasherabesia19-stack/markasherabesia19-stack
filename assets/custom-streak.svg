<svg width="400" height="195" viewBox="0 0 400 195"
    xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="400" height="195" rx="10" fill="url(#bg)"
        stroke="#00B4FF" stroke-width="1.5"/>
  <!-- title -->
  <text x="200" y="32" font-family="monospace" font-size="13"
        fill="#00B4FF" text-anchor="middle" font-weight="bold"
        letter-spacing="2">MONTHLY STREAK</text>
  <!-- fire icon -->
  <text x="200" y="95" font-size="38" text-anchor="middle"
        fill="#FF6B6B">🔥</text>
  <!-- streak count -->
  <text x="200" y="128" font-family="monospace" font-size="40"
        fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text>
  <text x="200" y="148" font-family="monospace" font-size="12"
        fill="#888888" text-anchor="middle">consecutive months</text>
  <!-- divider -->
  <line x1="20" y1="160" x2="380" y2="160" stroke="#30363d" stroke-width="1"/>
  <!-- status -->
  <text x="200" y="180" font-family="monospace" font-size="11"
        fill="#00FF88" text-anchor="middle">🔥 Streak Safe!</text>
  <!-- current month commits note -->
  <text x="200" y="192" font-family="monospace" font-size="9.5"
        fill="#555" text-anchor="middle">This month: 12 commit(s) · Rule: ≥3/month keeps streak alive</text>
</svg>